name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships npm 11, which trusted publishing requires. No dependency cache in release builds.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Check tag matches package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package v${version}"; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - name: Pack
        run: npm pack --ignore-scripts
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@tlelabs/raw@${version}" version >/dev/null 2>&1; then
            echo "@tlelabs/raw@${version} is already on npm; skipping publish"
          else
            npm publish "tlelabs-raw-${version}.tgz" --access public
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" tlelabs-raw-*.tgz --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
